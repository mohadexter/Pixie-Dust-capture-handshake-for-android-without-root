<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101828"/>
      <stop offset="100%" stop-color="#1a2332"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.5" r="0.45">
      <stop offset="0%" stop-color="#3B36C9" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#101828" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- subtle dot grid -->
  <g fill="#ffffff" fill-opacity="0.04">
    <circle cx="40" cy="40" r="1.5"/><circle cx="80" cy="40" r="1.5"/><circle cx="120" cy="40" r="1.5"/>
    <circle cx="40" cy="80" r="1.5"/><circle cx="80" cy="80" r="1.5"/><circle cx="120" cy="80" r="1.5"/>
    <circle cx="40" cy="120" r="1.5"/><circle cx="80" cy="120" r="1.5"/><circle cx="120" cy="120" r="1.5"/>
    <circle cx="1160" cy="520" r="1.5"/><circle cx="1200" cy="520" r="1.5"/><circle cx="1240" cy="520" r="1.5"/>
    <circle cx="1160" cy="560" r="1.5"/><circle cx="1200" cy="560" r="1.5"/><circle cx="1240" cy="560" r="1.5"/>
    <circle cx="1160" cy="600" r="1.5"/><circle cx="1200" cy="600" r="1.5"/><circle cx="1240" cy="600" r="1.5"/>
  </g>

  <!-- app icon (rounded square) -->
  <g transform="translate(120,190)">
    <rect width="260" height="260" rx="52" ry="52" fill="#101828"/>
    <rect width="260" height="260" rx="52" ry="52" fill="none" stroke="#3B36C9" stroke-width="2" stroke-opacity="0.4"/>
    <!-- Wi-Fi signal arc -->
    <path d="M60,110 C100,70 160,60 200,85" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"/>
    <!-- dust particles -->
    <circle cx="75" cy="185" r="12" fill="#F5A524"/>
    <circle cx="110" cy="150" r="9" fill="#FFC457"/>
    <circle cx="135" cy="120" r="6" fill="#FFD98A"/>
  </g>

  <!-- title -->
  <text x="440" y="270" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">Pixie WPS <tspan fill="#10B981">No Root</tspan></text>

  <!-- subtitle (two lines, inside the frame) -->
  <text x="440" y="320" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#9CA3AF">WPS &amp; capture handshake security audit</text>
  <text x="440" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="26" fill="#9CA3AF">on Android, without root, <tspan fill="#10B981" font-weight="700">WITH OTG</tspan></text>

  <!-- tagline -->
  <text x="440" y="395" font-family="Consolas, monospace" font-size="18" fill="#6B7280">Java + Python 3.11 + libusb 1.0.30 over USB OTG</text>

  <!-- usage hint (two lines, inside the frame) -->
  <text x="440" y="425" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4B5563">Plug a USB Wi-Fi adapter via OTG, then scan,</text>
  <text x="440" y="448" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4B5563">capture or audit your own network.</text>

  <!-- badges -->
  <g transform="translate(440,480)">
    <rect width="130" height="32" rx="16" fill="#1F2937"/>
    <text x="65" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#10B981" text-anchor="middle">ARM only</text>
    <rect x="145" width="160" height="32" rx="16" fill="#1F2937"/>
    <text x="225" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#8B5CF6" text-anchor="middle">No INTERNET perm</text>
    <rect x="320" width="110" height="32" rx="16" fill="#1F2937"/>
    <text x="375" y="22" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#F59E0B" text-anchor="middle">GPL-2.0</text>
  </g>

  <!-- footer -->
  <text x="440" y="560" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#4B5563">github.com/mohadexter/Pixie-Dust-for-android-without-root</text>
</svg>
